# Lean security providers for li-tools native image builds.
# Preserve all security policies, including algorithm restrictions, from the build JDK.
include ${java.home}/conf/security/java.security

# Strips out unused enterprise providers (JdkLDAP, SunJGSS, XMLDSig, SunPCSC)
# which transitively pull in java.rmi, java.naming, and jdk.naming.dns.
security.provider.1=SUN
security.provider.2=SunRsaSign
security.provider.3=SunEC
security.provider.4=SunJSSE
security.provider.5=SunJCE
security.provider.6=Apple
# End the contiguous provider list; otherwise the included JDK entries continue at 7.
security.provider.7=
