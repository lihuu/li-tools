<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="300" fill="#38BDF8" opacity="0.06" filter="blur(80px)"/>
  <circle cx="1100" cy="500" r="350" fill="#818CF8" opacity="0.08" filter="blur(100px)"/>

  <!-- Border & Grid accents -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Logo Shield -->
  <g transform="translate(100, 120) scale(1.6)">
    <rect width="64" height="64" rx="14" fill="#1F2937" opacity="0.6"/>
    <path d="M32 10 L48 18 V33 C48 43.5 41.2 52.2 32 55 C22.8 52.2 16 43.5 16 33 V18 Z" fill="url(#accentGrad)"/>
    <path d="M32 14 L44 20.5 V32 C44 40.5 38.8 47.8 32 50.5 C25.2 47.8 20 40.5 20 32 V20.5 Z" fill="#0B0F19"/>
    <path d="M26 27 L31 32 L26 37" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="33" y1="37" x2="39" y2="37" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="230" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#F9FAFB" letter-spacing="-1">li-tools</text>
  <text x="230" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#9CA3AF">Modern, Zero-Runtime-Dependency Developer Security Matrix</text>

  <!-- Tool Cards Grid -->
  <!-- Card 1: gpgkit -->
  <g transform="translate(100, 270)">
    <rect width="300" height="230" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="28" y="50" font-family="monospace" font-size="22" font-weight="700" fill="#60A5FA">gpgkit</text>
    <text x="28" y="80" font-family="-apple-system, sans-serif" font-size="15" fill="#9CA3AF">GPG Key Lifecycle &amp; Backup</text>
    <rect x="28" y="105" width="244" height="42" rx="8" fill="#1F2937"/>
    <text x="40" y="131" font-family="monospace" font-size="13" fill="#E5E7EB">gpgkit backup</text>
    <text x="28" y="180" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Verifiable loopback restore</text>
    <text x="28" y="202" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Zero-config Ed25519 keys</text>
  </g>

  <!-- Card 2: certkit -->
  <g transform="translate(450, 270)">
    <rect width="300" height="230" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="28" y="50" font-family="monospace" font-size="22" font-weight="700" fill="#34D399">certkit</text>
    <text x="28" y="80" font-family="-apple-system, sans-serif" font-size="15" fill="#9CA3AF">SSL/TLS Certs &amp; Local CA</text>
    <rect x="28" y="105" width="244" height="42" rx="8" fill="#1F2937"/>
    <text x="40" y="131" font-family="monospace" font-size="13" fill="#E5E7EB">certkit gen localhost</text>
    <text x="28" y="180" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Local browser green-lock</text>
    <text x="28" y="202" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Win 11 non-elevated trust</text>
  </g>

  <!-- Card 3: tokenkit -->
  <g transform="translate(800, 270)">
    <rect width="300" height="230" rx="16" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="28" y="50" font-family="monospace" font-size="22" font-weight="700" fill="#FBBF24">tokenkit</text>
    <text x="28" y="80" font-family="-apple-system, sans-serif" font-size="15" fill="#9CA3AF">Encrypted Token Manager</text>
    <rect x="28" y="105" width="244" height="42" rx="8" fill="#1F2937"/>
    <text x="40" y="131" font-family="monospace" font-size="13" fill="#FDE68A">eval "$(tokenkit env)"</text>
    <text x="28" y="180" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Sub-10ms shell injection</text>
    <text x="28" y="202" font-family="-apple-system, sans-serif" font-size="13" fill="#6B7280">• Embedded AES-256 SQLite</text>
  </g>

  <!-- Footer Platform Badges -->
  <text x="100" y="555" font-family="monospace" font-size="15" fill="#6B7280">Java 25 • GraalVM Native Image • macOS • Linux • Windows 11 • tools.lihu.me</text>
</svg>
