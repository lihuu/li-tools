name: Set up project GraalVM CE
description: Use the same pinned GraalVM CE for JVM tests and Native builds
runs:
  using: composite
  steps:
    - uses: graalvm/setup-graalvm@v1
      with:
        version: '25.4.4.1.1'
        distribution: 'graalvm-community'
        cache: 'maven'
        check-for-updates: 'false'
    - name: Verify GraalVM CE version
      shell: bash
      run: |
        java --version
        native_version="$(native-image --version)"
        printf '%s\n' "$native_version"
        printf '%s\n' "$native_version" | grep -F 'GraalVM CE 25.4.4.1.1+1.1'
        mvn --version
