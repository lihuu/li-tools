name: Release Native Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native on ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            platform: linux
            arch: amd64
            binary-ext: ""
          - runs-on: [self-hosted, macOS, ARM64]
            platform: darwin
            arch: arm64
            binary-ext: ""
          - runs-on: windows-latest
            platform: windows
            arch: amd64
            binary-ext: ".exe"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pinned GraalVM CE
        uses: ./.github/actions/setup-graalvm

      - name: Build Native Binaries
        shell: bash
        run: ./build-native.sh

      - name: Smoke Test Native Binaries
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python scripts/smoke-native.py
          else
            python3 scripts/smoke-native.py
          fi

      - name: Stage Native Binaries
        shell: bash
        run: |
          for tool in gpgkit certkit tokenkit; do
            cp "$tool/target/$tool${{ matrix.binary-ext }}" "$tool-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.binary-ext }}"
          done

      - name: Upload Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            gpgkit-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.binary-ext }}
            certkit-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.binary-ext }}
            tokenkit-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.binary-ext }}

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Package Release Archives (.tar.gz and .zip)
        run: python3 scripts/package-release-archives.py --assets-dir release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Sync Homebrew Tap and Scoop Bucket
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ECOSYSTEM_TOKEN: ${{ secrets.ECOSYSTEM_TOKEN }}
        run: |
          python3 scripts/sync-package-managers.py \
            --sums release-assets/SHA256SUMS.txt \
            --version "${GITHUB_REF_NAME#v}"
