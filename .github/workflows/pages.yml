name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate SEO TDK Constraints
        run: |
          node -e '
          const fs = require("fs");
          const en = fs.readFileSync("site/index.html", "utf8");
          const zh = fs.readFileSync("site/index_zh.html", "utf8");
          const enTitle = en.match(/<title>(.*?)<\/title>/)[1].length;
          const enDesc = en.match(/name="description" content="(.*?)"/)[1].length;
          const zhTitle = zh.match(/<title>(.*?)<\/title>/)[1].length;
          const zhDesc = zh.match(/name="description" content="(.*?)"/)[1].length;
          if (enTitle < 40 || enTitle > 60) throw new Error(`EN Title length ${enTitle} outside 40-60`);
          if (enDesc < 120 || enDesc > 155) throw new Error(`EN Desc length ${enDesc} outside 120-155`);
          if (zhTitle < 40 || zhTitle > 60) throw new Error(`ZH Title length ${zhTitle} outside 40-60`);
          if (zhDesc < 120 || zhDesc > 155) throw new Error(`ZH Desc length ${zhDesc} outside 120-155`);
          console.log("✅ All TDK constraints successfully validated!");
          '

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Search Engines (IndexNow)
        # gitleaks:allow
        run: |
          echo "Pinging IndexNow for Bing and AI Search Engines..."
          python3 -c '
          import json, urllib.request

          key = "c6bb5a53b6386d2fdfd867988ff31490"
          payload = {
              "host": "tools.lihu.me",
              "key": key,
              "keyLocation": f"https://tools.lihu.me/{key}.txt",
              "urlList": [
                  "https://tools.lihu.me/",
                  "https://tools.lihu.me/index_zh.html",
                  "https://tools.lihu.me/skillkit/",
                  "https://tools.lihu.me/skillkit/index_zh.html",
                  "https://tools.lihu.me/skillkit/SKILL.md",
                  "https://tools.lihu.me/tokenkit/",
                  "https://tools.lihu.me/tokenkit/index_zh.html",
                  "https://tools.lihu.me/gpgkit/",
                  "https://tools.lihu.me/gpgkit/index_zh.html",
                  "https://tools.lihu.me/certkit/",
                  "https://tools.lihu.me/certkit/index_zh.html",
                  "https://tools.lihu.me/llms.txt",
                  "https://tools.lihu.me/llms-full.txt"
              ]
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"IndexNow Status: {resp.status}")
          except Exception as e:
              print(f"IndexNow Warning: {e}")
          ' || true
