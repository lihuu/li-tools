name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate SEO TDK Constraints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SEO TDK Constraints
        run: |
          node -e '
          const fs = require("fs");
          const en = fs.readFileSync("site/index.html", "utf8");
          const zh = fs.readFileSync("site/index_zh.html", "utf8");

          const enTitleMatch = en.match(/<title>(.*?)<\/title>/);
          const enDescMatch = en.match(/name="description" content="(.*?)"/);
          const zhTitleMatch = zh.match(/<title>(.*?)<\/title>/);
          const zhDescMatch = zh.match(/name="description" content="(.*?)"/);

          if (!enTitleMatch || !enTitleMatch[1].trim()) throw new Error("Missing or empty EN <title>");
          if (!enDescMatch || !enDescMatch[1].trim()) throw new Error("Missing or empty EN <meta name=\"description\">");
          if (!zhTitleMatch || !zhTitleMatch[1].trim()) throw new Error("Missing or empty ZH <title>");
          if (!zhDescMatch || !zhDescMatch[1].trim()) throw new Error("Missing or empty ZH <meta name=\"description\">");

          console.log(`EN Title (${enTitleMatch[1].length}): "${enTitleMatch[1]}"`);
          console.log(`EN Description (${enDescMatch[1].length}): "${enDescMatch[1]}"`);
          console.log(`ZH Title (${zhTitleMatch[1].length}): "${zhTitleMatch[1]}"`);
          console.log(`ZH Description (${zhDescMatch[1].length}): "${zhDescMatch[1]}"`);

          if (enTitleMatch[1].length < 20 || enTitleMatch[1].length > 70) {
            console.warn(`::warning::EN Title length ${enTitleMatch[1].length} is outside recommended 20-70 chars`);
          }
          if (enDescMatch[1].length < 50 || enDescMatch[1].length > 200) {
            console.warn(`::warning::EN Description length ${enDescMatch[1].length} is outside recommended 50-200 chars`);
          }
          if (zhTitleMatch[1].length < 15 || zhTitleMatch[1].length > 60) {
            console.warn(`::warning::ZH Title length ${zhTitleMatch[1].length} is outside recommended 15-60 chars`);
          }
          if (zhDescMatch[1].length < 40 || zhDescMatch[1].length > 200) {
            console.warn(`::warning::ZH Description length ${zhDescMatch[1].length} is outside recommended 40-200 chars`);
          }

          console.log("✅ All TDK checks completed successfully!");
          '

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping Search Engines (IndexNow)
        # gitleaks:allow
        run: |
          echo "Pinging IndexNow for Bing and AI Search Engines..."
          python3 -c '
          import json, urllib.request

          key = "c6bb5a53b6386d2fdfd867988ff31490"
          payload = {
              "host": "tools.lihu.me",
              "key": key,
              "keyLocation": f"https://tools.lihu.me/{key}.txt",
              "urlList": [
                  "https://tools.lihu.me/",
                  "https://tools.lihu.me/index_zh.html",
                  "https://tools.lihu.me/skillkit/",
                  "https://tools.lihu.me/skillkit/index_zh.html",
                  "https://tools.lihu.me/tokenkit/",
                  "https://tools.lihu.me/tokenkit/index_zh.html",
                  "https://tools.lihu.me/gpgkit/",
                  "https://tools.lihu.me/gpgkit/index_zh.html",
                  "https://tools.lihu.me/certkit/",
                  "https://tools.lihu.me/certkit/index_zh.html",
                  "https://tools.lihu.me/dukit/",
                  "https://tools.lihu.me/dukit/index_zh.html"
              ]
          }
          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=data,
              headers={"Content-Type": "application/json; charset=utf-8"}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print(f"IndexNow Status: {resp.status}")
          except Exception as e:
              print(f"IndexNow Warning: {e}")
          ' || true
