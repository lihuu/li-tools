name: Cross-Platform CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/**"
      - "*.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "site/**"
      - "*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pinned GraalVM CE
        uses: ./.github/actions/setup-graalvm

      - name: Test Native Build Orchestration
        shell: bash
        run: python -m unittest discover -s scripts/tests -v

      - name: Run Maven Tests Across All Modules
        run: mvn clean test --batch-mode

  # macOS runs after merge on the self-hosted Mac mini. Pull request code must
  # not execute there: this repository is public, and a PR can change both this
  # workflow and the tests it runs.
  test-macos:
    name: Test on macOS (self-hosted)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up pinned GraalVM CE
        uses: ./.github/actions/setup-graalvm

      - name: Test Native Build Orchestration
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run Maven Tests Across All Modules
        run: mvn clean test --batch-mode
