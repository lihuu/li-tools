name: Cross-Platform CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/**"
      - "*.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven Tests Across All Modules
        run: mvn clean test --batch-mode
